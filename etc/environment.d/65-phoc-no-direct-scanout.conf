# Tab S7+ (gts7xlwifi): phoc on the hwcomposer backend driving the command-mode DSI panel
# direct-scans-out a fullscreen surface straight to the HW composer (a zero-copy optimization)
# and then fails to recomposite when a new window maps on top -- so a newly-launched app does
# not appear on screen until a lock/unlock (or screen blank/wake) forces a full repaint.
# Disabling direct scanout makes phoc always composite, so new windows render immediately.
# Minor extra GPU/compositing cost; correctness/responsiveness win. Confirmed: apps now pop
# up right away instead of needing a lock/unlock.
WLR_SCENE_DISABLE_DIRECT_SCANOUT=1
