# Phosh compositor (phoc) configuration for Samsung Galaxy Tab S7+ Wi-Fi.
# Physical panel: 12.4" 2800x1752 120Hz Super AMOLED, ~340 dpi.
# Stock surface_flinger.primary_display_orientation = ORIENTATION_270 in
# OneUI, indicating Samsung applies a 270deg transform to the panel's
# native portrait orientation. Halium's hwcomposer should pre-rotate
# for us; if not, uncomment the rotate line under HWCOMPOSER-1.

#[core]
#xwayland=false

[output:DSI-1]
scale = 2

[output:Virtual-1]
# x86 VM (QXL) shaped roughly like the tablet, useful for testing in qemu.
modeline = 138.50  1920 1968 2000 2080  1200 1203 1209 1235 +hsync -vsync
mode = 1920x1200
scale = 1

[output:X11-1]
mode = 1400x900
scale = 1

[output:WL-1]
mode = 1400x900
scale = 1

[output:HWCOMPOSER-1]
# 2800x1752 / 2 = 1400x876 logical resolution — comfortable for a tablet.
scale = 2
# rotate = 270
