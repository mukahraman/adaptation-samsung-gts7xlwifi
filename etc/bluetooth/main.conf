# Samsung Galaxy Tab S7+ (gts7xlwifi) Bluetooth adapter config.
#
# Set the adapter Class of Device so peer devices classify the tablet correctly.
# Stock Droidian leaves the CoD major class as "Miscellaneous" (0x000000), which
# makes phones treat the tablet as an audio sink (headphone/music-note icon) and
# refuse to offer file transfer. 0x00010c = Major device class "Computer", minor
# "Laptop"; BlueZ adds the service-class bits (Audio, Object Transfer, ...)
# dynamically from the active profiles, so only the device class is pinned here.
#
# Everything else is left at BlueZ defaults. The BT stack itself (adapter,
# pairing, A2DP) is fixed in the kernel (hci_sock un-gut + rfcomm/bnep/hidp
# Makefile build) and needs no userspace config. See FIXES-TO-BAKE.md.
[General]
Class = 0x00010c
